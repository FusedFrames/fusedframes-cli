[package]
name = "fusedframes-cli"
version = "2.0.3"
edition = "2024"
rust-version = "1.88"
description = "CLI for finding and reading your FusedFrames guides"
license = "MIT"
authors = ["FusedFrames <hello@fusedframes.com>"]
homepage = "https://www.fusedframes.com"
documentation = "https://www.fusedframes.com/docs"
repository = "https://github.com/FusedFrames/fusedframes-cli"
readme = "README.md"
keywords = ["fusedframes", "cli", "guides", "ai-agent"]
categories = ["command-line-utilities"]

[[bin]]
name = "fusedframes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
# `preserve_order` keeps response JSON keys in the order the API sent them and
# `arbitrary_precision` re-emits numbers exactly as received (no 1.0 → 1
# normalisation, no precision loss above 2^53), so output is a byte-faithful
# pass-through of what the server sent.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
# rustls (no OpenSSL), native OS trust roots so enterprise CAs work. The API
# compresses responses when asked; gzip/brotli keep large graph payloads fast.
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls-native-roots",
  "gzip",
  "brotli",
] }
url = "2"
rpassword = "7"
clap_complete = "4.6.9"
# Enclave attestation. `attestation-doc-validation` and the AWS Nitro SDK both
# pull OpenSSL (or a C library) into a binary that is deliberately pure Rust on
# rustls, so the COSE_Sign1 (ES384) verification in `src/attestation.rs` is done
# directly with RustCrypto primitives instead.
base64 = "0.22"
ciborium = "0.2"
hex = "0.4"
p384 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
x509-parser = "0.16"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
mockito = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
# Pass-through CLI: module names intentionally mirror the command groups.
module_name_repetitions = "allow"
# Doc comments name products (FusedFrames, TypeScript) that aren't code items.
doc_markdown = "allow"
