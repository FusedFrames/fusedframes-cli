name: Feature request
description: Suggest something the CLI should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the CLI makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed command or flag
      description: How you imagine it working and what the JSON output would hold.
      render: shell
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other commands, scripts or tools you tried first.
    validations:
      required: false
