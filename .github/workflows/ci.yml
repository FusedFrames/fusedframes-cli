name: CI

on:
  pull_request:
  push:
    branches: [main, v2-high]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Display names are decoupled from runner labels so the required-check
    # contexts on main survive future runner swaps.
    name: Format, Lint & Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blacksmith runners (need the Blacksmith GitHub App installed on
          # the org; without it jobs queue forever — revert to the GitHub
          # ubuntu-latest/macos-latest labels to detach).
          - name: linux
            runner: blacksmith-4vcpu-ubuntu-2404
          - name: macos
            runner: blacksmith-6vcpu-macos-latest
          # Blacksmith's Windows runners are still public beta; stay on
          # GitHub-hosted until they graduate.
          - name: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: MSRV (1.88)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  npm-packaging:
    name: npm launcher syntax
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: node --check npm/fusedframes/bin/fusedframes.js
      - run: node --check npm/prepare.mjs
