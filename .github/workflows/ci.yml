name: CI

on:
  pull_request:
  push:
    branches: [main, v2-high]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Linux and macOS run on Blacksmith runners (this needs the Blacksmith
        # GitHub App installed on the org; without it jobs queue forever —
        # drop the `runner` overrides to detach). `matrix.os` keeps the
        # GitHub-hosted names so the required-check contexts in branch
        # protection stay stable. Windows stays GitHub-hosted while
        # Blacksmith's Windows runners are in public beta.
        include:
          - os: ubuntu-latest
            runner: blacksmith-4vcpu-ubuntu-2404
          - os: macos-latest
            runner: blacksmith-6vcpu-macos-latest
    runs-on: ${{ matrix.runner || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: MSRV (1.88)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  npm-packaging:
    name: npm launcher syntax
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: node --check npm/fusedframes/bin/fusedframes.js
      - run: node --check npm/prepare.mjs
